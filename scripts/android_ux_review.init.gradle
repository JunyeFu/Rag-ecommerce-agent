// Install a separate review identity; never replace the user's existing app data.
gradle.beforeProject { project ->
    project.plugins.withId('com.android.application') {
        project.extensions.getByName('androidComponents').finalizeDsl { dsl ->
            if (project.path == ':app') dsl.defaultConfig.applicationId = project.findProperty('qaApplicationId') ?: 'com.ragcommerce.agent.uxreview'
        }
    }
}
