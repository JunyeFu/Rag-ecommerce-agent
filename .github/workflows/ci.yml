name: CI - Backend Tests

on:
  push:
    branches: [main, develop]
    paths: ['apps/backend/**', 'infrastructure/**']
  pull_request:
    branches: [main]
    paths: ['apps/backend/**', 'infrastructure/**']

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: cd apps/backend && pip install -r requirements.txt
      - name: Run unit tests (no external deps)
        run: cd apps/backend && python -m pytest tests/ -m unit -v
        env:
          APP_ENV: testing
          DEMO_MODE: "true"
          AUTO_IMPORT_DATA: "false"

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: shopping
          POSTGRES_PASSWORD: shopping123
          POSTGRES_DB: shopping_agent
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/backend/requirements.txt
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: cd apps/backend && pip install -r requirements.txt
      - name: Run integration tests
        run: cd apps/backend && python -m pytest tests/ -m integration -v --timeout=60
        env:
          DATABASE_URL: postgresql+asyncpg://shopping:shopping123@localhost:5432/shopping_agent
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          APP_ENV: testing
          AUTO_IMPORT_DATA: "false"
          HF_ENDPOINT: https://hf-mirror.com
