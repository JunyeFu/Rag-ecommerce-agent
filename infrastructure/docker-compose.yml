services:
  backend:
    build: ../apps/backend
    container_name: shopping-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      - APP_PORT=${APP_PORT:-8080}
      - DATABASE_URL=postgresql+asyncpg://shopping:shopping123@postgres:5432/shopping_agent
      - HF_ENDPOINT=${HF_ENDPOINT:-https://hf-mirror.com}
    env_file:
      - env/.env.docker
    volumes:
      - model_cache:/root/.cache
      - ../apps/backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${APP_PORT:-8080}/health"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 300s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: shopping-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: shopping
      POSTGRES_PASSWORD: shopping123
      POSTGRES_DB: shopping_agent
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopping -d shopping_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  model_cache:
